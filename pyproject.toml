[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arma4os"
version = "0.1.0"
description = "Goal-aware adaptive resource management control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arma4os = "arma4os.cli:main"

[tool.setuptools.packages.find]
include = ["arma4os*", "benchmarks*"]
